<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Coin Rush PvP</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b0f19; color: #fff; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; }
    
    .top-bar { padding: 15px; background: #151c2c; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #243049; }
    .pool-badge { background: linear-gradient(90deg, #f59e0b, #d97706); padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 13px; color: #000; }
    
    .screen { flex: 1; display: none; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; }
    .active { display: flex; }

    .balance-val { font-size: 36px; font-weight: 900; color: #fbbf24; margin: 10px 0; }

    /* PvP Картка */
    .pvp-card { width: 100%; max-width: 340px; background: #172033; border: 2px solid #3b82f6; border-radius: 16px; padding: 20px; text-align: center; margin-top: 15px; }
    .bet-selector { display: flex; justify-content: center; gap: 10px; margin: 15px 0; }
    .bet-btn { background: #243049; border: 1px solid #3b82f6; color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .bet-btn.selected { background: #3b82f6; }

    .btn-fight { width: 100%; background: linear-gradient(90deg, #ef4444, #dc2626); color: #fff; border: none; padding: 14px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
    .btn-fight:active { transform: scale(0.98); }

    /* Лутбокси */
    .box-card { width: 100%; max-width: 340px; background: #172033; border: 1px solid #f59e0b; border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 15px; }
    .btn-buy-box { background: #f59e0b; color: #000; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 10px; }

    /* Навігація */
    .nav { height: 60px; background: #151c2c; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #243049; }
    .nav-item { background: none; border: none; color: #64748b; font-size: 13px; font-weight: bold; cursor: pointer; }
    .nav-item.active { color: #3b82f6; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div id="username">👤 Гравець</div>
    <div class="pool-badge">🏆 Пул: <span id="pool-stars">0</span> ⭐</div>
  </div>

  <!-- Экран Арени (PvP) -->
  <div class="screen active" id="tab-pvp">
    <div style="font-size: 14px; color: #94a3b8;">Твій Баланс</div>
    <div class="balance-val" id="coins">0 🪙</div>

    <div class="pvp-card">
      <h2>⚔️ PvP Арена</h2>
      <p style="font-size: 13px; color: #94a3b8; margin-top: 5px;">Знайди суперника та забрай 90% банку за швидкість!</p>
      
      <div class="bet-selector">
        <button class="bet-btn selected" onclick="selectBet(100, this)">100</button>
        <button class="bet-btn" onclick="selectBet(500, this)">500</button>
        <button class="bet-btn" onclick="selectBet(2000, this)">2000</button>
      </div>

      <button class="btn-fight" onclick="startFight()">ШУКАТИ СУПЕРНИКА ⚔️</button>
    </div>
    
    <div style="margin-top: 15px; font-size: 13px; color: #64748b;">Перемог у арені: <b id="wins-cnt" style="color:#fff;">0</b></div>
  </div>

  <!-- Экран Скриньок -->
  <div class="screen" id="tab-boxes">
    <h2 style="margin-bottom: 15px;">🎁 Таємничі Скрині</h2>
    
    <div class="box-card">
      <div style="font-size: 50px;">📦</div>
      <h3>Золота Скриня</h3>
      <p style="font-size: 12px; color: #94a3b8; margin: 8px 0;">Містить від 5,000 до 50,000 монет для великих ставок у PvP!</p>
      <button class="btn-buy-box" onclick="buyBox(25)">Відкрити за 25 ⭐</button>
    </div>
  </div>

  <!-- Экран ТОП -->
  <div class="screen" id="tab-top">
    <h2 style="margin-bottom: 15px;">🏆 Топ Бійців Арени</h2>
    <div id="leaderboard" style="width: 100%; max-width: 340px;"></div>
  </div>

  <div class="nav">
    <button class="nav-item active" onclick="openTab('pvp', this)">⚔️ Арена</button>
    <button class="nav-item" onclick="openTab('boxes', this)">🎁 Скрині</button>
    <button class="nav-item" onclick="openTab('top', this)">🏆 Лідери</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const user = tg?.initDataUnsafe?.user || { id: 999, first_name: 'Тест' };
    document.getElementById('username').innerText = '👤 ' + user.first_name;

    let coins = 0;
    let currentBet = 100;

    fetch('/api/user/load', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: user.id, username: user.first_name })
    }).then(r => r.json()).then(data => {
      coins = data.coins;
      document.getElementById('coins').innerText = coins.toLocaleString() + ' 🪙';
      document.getElementById('wins-cnt').innerText = data.pvp_wins;
      document.getElementById('pool-stars').innerText = data.poolStars;
    });

    function selectBet(amount, btn) {
      currentBet = amount;
      document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }

    function startFight() {
      if (coins < currentBet) return alert('Недостатньо монет для ставки!');

      const fightBtn = document.querySelector('.btn-fight');
      fightBtn.innerText = 'ПОШУК СУПЕРНИКА... 🔍';
      fightBtn.disabled = true;

      setTimeout(() => {
        fetch('/api/pvp/fight', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: user.id, bet: currentBet })
        }).then(r => r.json()).then(res => {
          fightBtn.innerText = 'ШУКАТИ СУПЕРНИКА ⚔️';
          fightBtn.disabled = false;

          if (res.win) {
            alert(`🎉 ПЕРЕМОГА! Ти здолав суперника і забрав ${Math.floor(currentBet * 0.9)} монет!`);
          } else {
            alert(`ВТРАТА! Суперник виявився швидшим. -${currentBet} монет.`);
          }

          coins = res.newCoins;
          document.getElementById('coins').innerText = coins.toLocaleString() + ' 🪙';
          document.getElementById('wins-cnt').innerText = res.newWins;
        });
      }, 1500);
    }

    async function buyBox(stars) {
      const res = await fetch('/api/buy-box', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: user.id, stars })
      }).then(r => r.json());

      if (res.invoiceLink && tg) {
        tg.openInvoice(res.invoiceLink, (status) => {
          if (status === 'paid') location.reload();
        });
      }
    }

    function openTab(tab, btn) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      btn.classList.add('active');

      if (tab === 'top') {
        fetch('/api/leaderboard').then(r => r.json()).then(rows => {
          document.getElementById('leaderboard').innerHTML = rows.map((r, i) => `
            <div style="background:#172033; padding:12px; border-radius:10px; margin-bottom:8px; display:flex; justify-content:space-between;">
              <span><b>#${i+1}</b> ${r.username}</span>
              <span style="color:#ef4444; font-weight:bold;">⚔️ ${r.pvp_wins} перемог</span>
            </div>
          `).join('');
        });
      }
    }
  </script>
</body>
</html>
